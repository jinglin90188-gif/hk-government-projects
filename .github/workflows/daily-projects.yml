name: 每日采集香港政府项目并发布网站

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: Asia/Hong_Kong
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-projects.yml'
      - 'collect_projects.py'
      - 'snapshot_tools.py'
      - 'company_scope.py'
      - 'project_identity.py'
      - 'requirements*.txt'
      - 'scripts/**'
      - 'reports/**'
      - '周报运行规则.md'
      - 'tests/**'
      - 'dist/index.html'
      - 'dist/dashboard.*'
      - 'dist/links.json'

concurrency:
  group: daily-government-projects
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: 读取项目代码及上次成功数据
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 安装Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 安装采集依赖
        run: python -m pip install -r requirements.txt
      - name: 检查解析、日期与历史保留规则
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: 重新采集全部官方来源
        run: |
          mkdir -p cache
          python collect_projects.py --fresh --workers 8 2>&1 | tee cache/collection.log
      - name: 核对发布数据并保存每日变化记录
        run: |
          python scripts/validate_release.py
          python scripts/audit_departments.py
          python scripts/build_reports.py
          python scripts/archive_run.py
          python scripts/write_run_summary.py >> "$GITHUB_STEP_SUMMARY"
      - name: 保存项目清单和可恢复的来源状态
        run: python scripts/save_collected_data.py
      - name: 上传网站文件
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: 保留本次采集日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-log-${{ github.run_id }}
          path: |
            cache/collection.log
            采集核对报告.md
            state/failed-snapshot.json
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检查GitHub Pages设置
        uses: actions/configure-pages@v5
      - name: 发布项目库网站
        id: deployment
        uses: actions/deploy-pages@v4
