</style></head><body><main><header><a href="index.html">← 政府项目库</a><a href="https://github.com/jinglin90188-gif/hk-government-projects/actions" target="_blank" rel="noopener">更新运行记录 ↗</a></header><h1>机构采购与前期商机</h1><p id="time">正在读取公开数据…</p><div class="note">先知道项目，再深入查文件。本页只收匿名公开资料，不使用供应商账号。RFI、EOI、资格预审及采购计划不等于正式招标；文件可能需要登录、邮件索取或保密承诺。业务相关不代表公司满足资格。</div><div class="filters"><input id="q" aria-label="搜索项目" placeholder="搜索名称、编号或机构"><select id="org" aria-label="筛选机构"><option value="">全部机构</option></select><select id="kind" aria-label="筛选阶段"><option value="">全部阶段</option><option value="tender">正式招标</option><option value="rfi">信息征询 RFI</option><option value="eoi">意向征集 EOI</option><option value="prequalification">资格预审</option><option value="forecast">采购计划</option></select><label><input id="all" type="checkbox">包括非核心及待确认范围</label><label><input id="history" type="checkbox">包括历史、阶段待核实记录</label></div><p id="count"></p><p id="error" role="alert"></p><section id="projects" class="cards" aria-label="项目清单"></section><h2>九家机构的公开覆盖情况</h2><p class="muted">登记入口不等于已接通清单。下列状态按本次实际请求显示；访问失败、注册入口及未完成解析都不会算成“暂无项目”。</p><section id="coverage" class="coverage"></section><footer>点击“原文”进入机构官网自行核实。采购计划中的Completed只代表相应阶段完成，不推断新一轮招标、授标或续约。日期未注明时分时，不假定中午截止。</footer></main><script src="institutions.js" defer></script></body></html>
